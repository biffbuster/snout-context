name: nightly

# The watcher: every night, prove Snout still works against the latest agents and stays fresh.
# A failure here emails the repo owner (GitHub notifies on failed scheduled runs).
on:
  schedule:
    - cron: "0 7 * * *" # 07:00 UTC, 02:00 US Central
  workflow_dispatch:

jobs:
  # The full CI suite: every OS and Node version, eval gate, committed bundle, cloud, latency.
  ci:
    uses: ./.github/workflows/ci.yml

  # Does the latest Claude Code / Codex release still speak the hook contract Snout relies on?
  # Catches a renamed hook field the night it ships, before users notice Snout went quiet.
  agents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22.x"
      - run: node scripts/compat.mjs

  # Dependencies: dev-only today (Snout ships with none), so advisories warn instead of failing.
  deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22.x"
      - run: npm ci
      - run: npm audit --audit-level=high || echo "::warning::npm audit reported high-severity advisories in dev dependencies"
      - run: npm outdated || true
