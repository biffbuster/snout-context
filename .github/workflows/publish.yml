name: publish

# Releases go to npm from here, never from a laptop, with provenance: npm shows which commit and
# workflow built each version, so anyone can check the package matches this repository.
# Tag a release (git tag v0.3.0 && git push --tags) to run it. Needs the NPM_TOKEN secret
# (an npm automation token) in the repository's Actions secrets.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # lets npm sign the provenance statement

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          registry-url: "https://registry.npmjs.org"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run eval
      # The committed bundle must be exactly what src/ builds.
      - name: bundle matches src
        run: |
          cp dist/snout.mjs /tmp/committed.mjs
          npm run build
          diff -q /tmp/committed.mjs dist/snout.mjs
      - name: tag matches package.json version
        run: test "v$(node -p 'require("./package.json").version')" = "${GITHUB_REF_NAME}"
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
