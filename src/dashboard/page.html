<style>
/* Snout dashboard. White cards on a cool off-white, one accent (Snout pink) that means
   "kept out of context", and provider colors only where they mark a model or agent.
   Radii: cards 14px, tiles and inputs 10px, buttons 8px, chips 6px. */
:root {
  --bg: #f5f5f3; --card: #ffffff; --tile: #f7f7f5; --side: #ffffff; --ink: #18151a; --ink-2: #3a3a3f; --ink-3: #8b8b94; --muted: #6b6b73; --faint: #a3a3ab;
  --line: #ebebe8; --line-2: #e1e1dd; --seg: #ececea; --bar-in: #dcdcd7; --hover: #f2f2ef;
  --accent: #e653ba; --accent-ink: #b0307f; --accent-soft: #fdeaf6; --accent-hi: #f2a3d9;
  --ok: #15803d; --ok-soft: #e6f6ec; --info: #2563eb; --info-soft: #e8f0fe; --warn: #b45309; --warn-soft: #fdf2e2; --bad: #c2273d; --bad-soft: #fde8eb;
  --logo-bg: #ffffff; --logo-ink: #111113; --logo-line: #e6e6e3;
  --dot: #d6d6d2;
  --shadow: 0 1px 2px rgba(20, 20, 30, 0.04), 0 6px 20px -14px rgba(20, 20, 40, 0.18);
  --shadow-lg: 0 2px 4px rgba(20, 20, 30, 0.05), 0 24px 48px -24px rgba(20, 20, 40, 0.3);
  --sans: "Inter", ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #0d0d10; --card: #16161a; --tile: #1c1c21; --side: #121215; --ink: #f3f3f5; --ink-2: #d4d4d8; --ink-3: #8e8e98; --muted: #a1a1aa; --faint: #71717a;
  --line: #25252b; --line-2: #2f2f36; --seg: #24242a; --bar-in: #3d3d45; --hover: #1f1f25;
  --accent: #ee63b8; --accent-ink: #f58ccb; --accent-soft: #3a1830; --accent-hi: #a8467f;
  --ok: #4ade80; --ok-soft: #12281b; --info: #7aa2ff; --info-soft: #172241; --warn: #fbbf24; --warn-soft: #2e2310; --bad: #f87171; --bad-soft: #341518;
  --logo-bg: #202026; --logo-ink: #f3f3f5; --logo-line: #2f2f36;
  --dot: #2c2c33;
  --shadow: none; --shadow-lg: 0 24px 48px -24px rgba(0, 0, 0, 0.6);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 13.5px/1.45 var(--sans); -webkit-font-smoothing: antialiased; }
button, select, input { font: inherit; color: inherit; }
a { color: inherit; text-decoration: none; }
h1, h2, h3 { margin: 0; letter-spacing: -0.015em; }
p { margin: 0; }
code, .mono { font-family: var(--mono); font-size: 0.92em; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small, small { font-size: 12px; }
.grow { flex: 1; min-width: 0; }
.wrap { overflow-wrap: anywhere; white-space: normal; }
.accent-t { color: var(--accent-ink); }
.row { display: flex; align-items: center; gap: 8px; min-width: 0; }
.ic { flex: none; display: block; }
.ic.faint { color: var(--faint); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Shell */
.shell { display: grid; grid-template-columns: 236px 1fr; min-height: 100vh; transition: grid-template-columns 0.18s ease; }
.shell.collapsed { grid-template-columns: 64px 1fr; }
.side { background: var(--side); border-right: 1px solid var(--line); position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; padding: 14px 12px; gap: 6px; overflow: hidden; z-index: 6; }
.side-h { display: flex; align-items: center; justify-content: space-between; padding: 2px 4px 12px; gap: 6px; }
.brand { display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: 17px; letter-spacing: -0.02em; min-width: 0; }
.brand img { flex: none; }
.side-nav { display: flex; flex-direction: column; gap: 2px; overflow-y: auto; flex: 1; margin: 0 -4px; padding: 0 4px; }
.side-g { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--faint); padding: 14px 10px 6px; white-space: nowrap; }
.side-a { display: flex; align-items: center; gap: 11px; padding: 8px 10px; border-radius: 9px; color: var(--ink-2); font-weight: 500; white-space: nowrap; transition: background 0.12s; }
.side-a:hover { background: var(--hover); }
.side-a.on { background: var(--ink); color: var(--card); }
.side-a.on .ic { color: var(--card); }
:root[data-theme="dark"] .side-a.on { background: var(--accent-soft); color: var(--accent-ink); }
:root[data-theme="dark"] .side-a.on .ic { color: var(--accent-ink); }
.side-a .ic { color: var(--muted); }
.side-f { display: flex; flex-direction: column; gap: 10px; padding-top: 8px; }
.mode-card { border: 1px solid var(--line); border-radius: 12px; padding: 12px; background: var(--tile); display: flex; flex-direction: column; gap: 6px; }
.mode-card p { color: var(--muted); font-size: 12px; }
.mode-l { display: flex; align-items: baseline; gap: 6px; font-size: 12.5px; color: var(--muted); }
.mode-l b { text-transform: capitalize; color: var(--ink); font-size: 13.5px; }
.mode-l b.mode-enforce { color: var(--accent-ink); }
.mode-l b.mode-observe { color: var(--warn); }
.who { display: flex; align-items: center; gap: 10px; padding: 6px 4px; min-width: 0; }
.who b { display: block; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.who span:not(.avatar) { display: block; font-size: 11.5px; color: var(--muted); white-space: nowrap; }
.avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--accent-soft); color: var(--accent-ink); display: grid; place-items: center; flex: none; }
.collapsed .side { padding: 14px 10px; align-items: center; }
.collapsed .side-h { flex-direction: column; padding-bottom: 8px; }
.collapsed .brand span, .collapsed .side-a span, .collapsed .side-g, .collapsed .mode-card, .collapsed .who div { display: none; }
.collapsed .side-a { justify-content: center; padding: 9px; }
.collapsed .side-g { display: block; height: 10px; padding: 0; overflow: hidden; color: transparent; }

.body { min-width: 0; display: flex; flex-direction: column; }
.top { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 12px; height: 56px; padding: 0 24px; background: color-mix(in srgb, var(--bg) 86%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.crumbs { display: flex; align-items: center; gap: 6px; min-width: 0; white-space: nowrap; font-size: 13.5px; }
.crumb-p { color: var(--muted); overflow: hidden; text-overflow: ellipsis; max-width: 200px; }
.crumb-id { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.tools { margin-left: auto; display: flex; align-items: center; gap: 8px; flex-wrap: nowrap; }
.sel { background: var(--card); border: 1px solid var(--line-2); border-radius: 8px; padding: 6px 28px 6px 10px; font-size: 12.5px; max-width: 220px; height: 32px; cursor: pointer; appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position: calc(100% - 14px) 13px, calc(100% - 10px) 13px; background-size: 4px 4px; background-repeat: no-repeat; }
.sel.full { width: 100%; max-width: none; }
.seg { display: inline-flex; background: var(--seg); border-radius: 9px; padding: 2px; gap: 1px; height: 32px; align-items: stretch; }
.seg button { border: 0; background: none; padding: 0 11px; border-radius: 7px; font-size: 12.5px; font-weight: 550; color: var(--muted); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.seg button:hover { color: var(--ink); }
.seg button.on { background: var(--card); color: var(--ink); box-shadow: 0 1px 2px rgba(17, 17, 19, 0.1); }
.custom { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.custom input { border: 1px solid var(--line-2); background: var(--card); border-radius: 8px; padding: 4px 8px; height: 32px; font-size: 12.5px; }
.live { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--muted); white-space: nowrap; padding: 0 4px; }
.live i { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
.live.on { color: var(--ink-2); }
.live.on i { background: #22c55e; animation: ping 2.4s ease-out infinite; }
@keyframes ping { 0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.5); } 70%, 100% { box-shadow: 0 0 0 7px rgba(34, 197, 94, 0); } }
.icon-btn { width: 32px; height: 32px; display: inline-grid; place-items: center; border-radius: 8px; border: 1px solid var(--line-2); background: var(--card); cursor: pointer; color: var(--ink-2); flex: none; }
.icon-btn:hover { background: var(--hover); }
.icon-btn.collapse { border: 0; background: none; color: var(--muted); }
.icon-btn.collapse:hover { background: var(--hover); }

.main { padding: 22px 24px 64px; min-width: 0; outline: none; }
.page { max-width: 1440px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.page-h { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.page-h h1 { font-size: 22px; font-weight: 650; line-height: 1.25; }
.page-h h1.mono { font-size: 17px; font-weight: 600; overflow-wrap: anywhere; }
.page-h .sub { color: var(--muted); margin-top: 3px; }
.page-r { margin-left: auto; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.sub.meta { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 12px; }
.back { display: inline-flex; align-items: center; gap: 5px; color: var(--muted); font-size: 12.5px; margin-bottom: 6px; }
.back:hover { color: var(--ink); }
h2.section { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin-top: 8px; }

.loading { display: flex; align-items: center; gap: 10px; color: var(--muted); padding: 40px; justify-content: center; }
.loading i { width: 14px; height: 14px; border: 2px solid var(--line-2); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Buttons and small parts */
.btn { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line-2); background: var(--card); padding: 0 13px; height: 34px; border-radius: 9px; font-size: 13px; font-weight: 550; cursor: pointer; white-space: nowrap; color: var(--ink); }
.btn:hover { background: var(--hover); }
.btn:active { transform: translateY(1px); }
.btn.on { border-color: var(--accent); color: var(--accent-ink); background: var(--accent-soft); }
.btn.primary { background: var(--ink); color: var(--card); border-color: var(--ink); }
.btn.primary:hover { opacity: 0.9; }
.btn.sm { height: 28px; padding: 0 10px; font-size: 12px; border-radius: 7px; }
.btn.accent { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.accent:hover { opacity: 0.92; background: var(--accent); }
.link { color: var(--info); font-size: 12.5px; font-weight: 550; background: none; border: 0; cursor: pointer; padding: 0; display: inline-flex; gap: 5px; align-items: center; }
.link:hover { text-decoration: underline; }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 550; padding: 2px 8px; border-radius: 6px; white-space: nowrap; line-height: 1.5; }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.info { background: var(--info-soft); color: var(--info); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.accent { background: var(--accent-soft); color: var(--accent-ink); }
.chip.muted { background: var(--seg); color: var(--muted); }
.basis { display: inline-block; font-size: 10px; font-weight: 600; letter-spacing: 0.03em; text-transform: uppercase; padding: 0 5px; border-radius: 4px; border: 1px solid var(--line-2); color: var(--muted); vertical-align: 1px; line-height: 15px; cursor: help; }
.basis.est { border-style: dashed; }
.note { color: var(--muted); font-size: 12px; margin-top: 12px; display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; }
.note .ic { align-self: center; }
.pad { padding: 14px; }
.logo { display: inline-grid; place-items: center; border-radius: 7px; flex: none; border: 1px solid var(--logo-line); overflow: hidden; }
.logo svg, .logo img { display: block; }
:root[data-theme="dark"] .logo img.inv { filter: invert(1); }
.logo-stack { display: inline-flex; gap: 4px; }
.view-seg button .ic { color: inherit; }
.view-seg button.on.cloud { background: var(--accent-soft); color: var(--accent-ink); }
.cloud-banner { align-items: center; }
.cloud-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.cloud-list li { display: flex; align-items: center; gap: 10px; min-width: 0; }
.cloud-list b { display: block; font-size: 13px; }
.cloud-list small { display: block; font-size: 11.5px; }
/* Snout Cloud (hosted): connect steps, the signed-in person, small forms. */
img.avatar { object-fit: cover; }
.who .grow { min-width: 0; }
.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 18px; counter-reset: step; max-width: 640px; }
.steps li { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 12px; counter-increment: step; }
.steps li::before { content: counter(step); width: 26px; height: 26px; border-radius: 50%; background: var(--accent-soft); color: var(--accent-ink); font-weight: 650; font-size: 12px; display: grid; place-items: center; }
.steps b { display: block; }
.steps p { color: var(--muted); margin-top: 2px; }
.row-between { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.inline-form { display: flex; gap: 8px; margin-top: 14px; }
.input { flex: 1; min-width: 0; border: 1px solid var(--line-2); background: var(--card); color: var(--ink); border-radius: 8px; padding: 4px 10px; height: 32px; font: inherit; font-size: 12.5px; }
.input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.cell-logo .avatar { width: 28px; height: 28px; font-weight: 650; font-size: 12px; }
.cell-logo { display: inline-flex; align-items: center; gap: 8px; min-width: 0; }
.cell-logo small { display: block; color: var(--muted); font-size: 11.5px; }
.cell-main b { display: block; font-weight: 550; }
.cell-main small { color: var(--muted); }
.cell-main:hover b { color: var(--accent-ink); }
i.dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; flex: none; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { display: inline-block; width: 14px; height: 3px; border-radius: 2px; background: var(--ink-3); }
.sw.accent { background: var(--accent); }
.sw.dash { background: repeating-linear-gradient(90deg, var(--ink-3) 0 4px, transparent 4px 7px); }
.big { font-size: 26px; font-weight: 650; letter-spacing: -0.02em; }
.big small { font-size: 12px; font-weight: 500; color: var(--muted); letter-spacing: 0; }
.out { font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 5px; white-space: nowrap; background: var(--seg); color: var(--muted); text-transform: capitalize; }
.out.held-back, .out.trimmed { background: var(--accent-soft); color: var(--accent-ink); }
.out.would-hold-back { background: var(--warn-soft); color: var(--warn); }
.out.asked { background: var(--info-soft); color: var(--info); }
.code { display: flex; align-items: center; gap: 8px; background: var(--tile); border: 1px solid var(--line); border-radius: 9px; padding: 6px 6px 6px 12px; margin-top: 10px; }
.code code { flex: 1; min-width: 0; overflow-x: auto; white-space: nowrap; font-size: 12.5px; }
.code code::before { content: "$ "; color: var(--faint); }
.copy { border: 0; background: none; color: var(--muted); cursor: pointer; padding: 5px; border-radius: 6px; display: grid; place-items: center; }
.copy:hover { background: var(--hover); color: var(--ink); }
.empty { text-align: center; padding: 28px 16px; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 4px; }
.empty b { color: var(--ink); font-size: 14px; }
.empty .code { max-width: 360px; width: 100%; }
.empty.err { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 48px; gap: 10px; }
.banner { display: flex; align-items: flex-start; gap: 12px; border-radius: 12px; padding: 12px 14px; border: 1px solid var(--line); background: var(--card); }
.banner b { display: block; margin-bottom: 2px; }
.banner p { color: var(--muted); }
.banner.ok { background: var(--ok-soft); border-color: transparent; }
.banner.ok .ic { color: var(--ok); }
.banner.warn { background: var(--warn-soft); border-color: transparent; }
.banner.warn .ic { color: var(--warn); }
.banner .ic { margin-top: 1px; }

/* Switch */
.switch { width: 38px; height: 22px; border-radius: 11px; border: 0; background: var(--bar-in); position: relative; cursor: pointer; padding: 0; flex: none; transition: background 0.15s; }
.switch i { position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2); transition: transform 0.15s; }
.switch.on { background: var(--ok); }
.switch.on i { transform: translateX(16px); }
.switch[disabled] { cursor: default; opacity: 0.6; }
.switch-l { display: inline-flex; align-items: center; gap: 10px; font-size: 12.5px; color: var(--ink-2); }

/* Grid and cards */
.grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 16px; }
.span-3 { grid-column: span 3; } .span-4 { grid-column: span 4; } .span-5 { grid-column: span 5; } .span-6 { grid-column: span 6; }
.span-7 { grid-column: span 7; } .span-8 { grid-column: span 8; } .span-12 { grid-column: span 12; }
.grid > div { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.grid > div > .card { flex: 1; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 18px 20px; min-width: 0; position: relative; }
.card.flush { padding: 0; overflow: hidden; }
.card-h { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 14px; }
.card-h h3 { font-size: 14px; font-weight: 600; }
.card-h .sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
.card-r { margin-left: auto; display: flex; align-items: center; gap: 8px; flex: none; }

/* KPI strip */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); background: var(--card); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); }
.stat { padding: 14px 18px; display: flex; flex-direction: column; gap: 3px; min-width: 0; border-left: 1px solid var(--line); }
.stat:first-child { border-left: 0; }
.stat-l { color: var(--muted); font-size: 12px; font-weight: 500; }
.stat-v { font-size: 22px; font-weight: 650; letter-spacing: -0.02em; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat-f { color: var(--muted); font-size: 11.5px; line-height: 1.5; }
.stat.accent .stat-v { color: var(--accent-ink); }
.stat.warn .stat-v { color: var(--warn); }

/* Model cards (overview) */
.card.models { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); padding: 18px 0; }
.card.models > .empty { grid-column: 1 / -1; }
.model { padding: 2px 22px; border-left: 1px solid var(--line); display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.model:first-child { border-left: 0; }
.model-h { display: flex; align-items: center; gap: 12px; min-width: 0; }
.model-h b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.model-h span { display: block; font-size: 12px; color: var(--muted); }
.model-b { display: flex; align-items: flex-end; gap: 16px; }
.model-v { font-size: 23px; font-weight: 600; letter-spacing: -0.02em; display: flex; align-items: center; gap: 8px; }
.model-f { font-size: 12px; color: var(--muted); }
.model-f b { font-weight: 600; color: var(--ink-2); }
.model-f b.accent-t { color: var(--accent-ink); }
.model-m { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
.model-m > span { font-size: 11px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--info); animation: ping-b 1.8s ease-out infinite; flex: none; }
@keyframes ping-b { 0% { box-shadow: 0 0 0 0 rgba(37, 99, 235, 0.5); } 70%, 100% { box-shadow: 0 0 0 7px rgba(37, 99, 235, 0); } }
.ticks { display: flex; gap: 2px; height: 28px; width: 100%; max-width: 160px; }
.ticks i { flex: 1; border-radius: 1.5px; background: var(--seg); min-width: 2px; }

/* Tiles, lists, feed */
.tiles { display: flex; flex-direction: column; gap: 10px; }
.tiles.two { display: grid; grid-template-columns: 1fr 1fr; }
.tile { background: var(--tile); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.tile > span { font-size: 12px; color: var(--muted); }
.tile b { font-size: 19px; font-weight: 650; letter-spacing: -0.01em; }
.tile small { color: var(--muted); font-size: 11.5px; }
.list { list-style: none; margin: 0; padding: 0; }
.list li { border-top: 1px solid var(--line); }
.list li:first-child { border-top: 0; }
.list .row { padding: 10px 0; gap: 12px; }
.list a.row:hover b { color: var(--accent-ink); }
.list .grow b { display: block; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.list .grow small { display: block; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.when { color: var(--muted); font-size: 12px; white-space: nowrap; min-width: 64px; }
.feed { list-style: none; margin: 0; padding: 0; font-size: 12.5px; }
.feed li { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-top: 1px solid var(--line); }
.feed li:first-child { border-top: 0; }
.feed li .muted { font-size: 11.5px; white-space: nowrap; }
.feed li.kept b { color: var(--accent-ink); }
.feed .mono { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bars-list { list-style: none; margin: 12px 0 0; padding: 0; display: flex; flex-direction: column; gap: 9px; }
.bars-list li { display: grid; grid-template-columns: minmax(90px, 1fr) 2fr auto; gap: 10px; align-items: center; font-size: 12.5px; }
.bars-list li:has(> :nth-child(4)) { grid-template-columns: minmax(110px, 1fr) 44px 64px 64px; }
.bars-list .k { display: flex; align-items: center; gap: 7px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bars-list b, .bars-list .num { text-align: right; }
.stack { display: flex; border-radius: 4px; overflow: hidden; background: var(--seg); width: 100%; }
.stack i { display: block; height: 100%; }
.mini { list-style: none; margin: 0; padding: 0; font-size: 12.5px; }
.mini li { display: flex; align-items: center; gap: 8px; padding: 5px 0; border-top: 1px dashed var(--line); }
.mini li:first-child { border-top: 0; }
.mini li .mono { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Agent time (overview) */
.act { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 4px; min-height: 230px; }
.act-col { border-left: 1.5px dashed var(--c); padding: 0 0 0 10px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.act-h { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--ink-2); }
.act-v { font-size: 20px; font-weight: 600; letter-spacing: -0.02em; }
.delta { font-size: 11.5px; color: var(--muted); }
.delta.up { color: var(--ok); }
.delta.down { color: var(--bad); }
.act-bar { margin-top: auto; display: flex; flex-direction: column; gap: 4px; margin-left: -10px; }
.act-bar small { color: var(--muted); padding-left: 10px; }
.act-bar i { display: block; background: var(--c); opacity: 0.9; border-radius: 2px 2px 0 0; }

/* Tables */
.table-wrap { overflow-x: auto; margin: 0 -4px; }
.card.flush .table-wrap { margin: 0; }
.t { width: 100%; border-collapse: collapse; font-size: 13px; }
.t th { text-align: left; font-weight: 500; font-size: 12px; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.t td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.t tr:last-child td { border-bottom: 0; }
.t tbody tr:hover td { background: var(--hover); }
.t .r, .t th.r { text-align: right; }
.t td .num { white-space: nowrap; }
.t.compact td { padding: 7px 10px; }
.t a:hover { color: var(--accent-ink); }
.t.cost td { padding: 9px 10px; }
.t.cost td b { font-weight: 600; }
.card.flush .t th { padding: 12px 16px; background: var(--tile); }
.card.flush .t td { padding: 11px 16px; }
.ctx-cell { display: inline-flex; flex-direction: column; gap: 4px; align-items: flex-end; min-width: 70px; }
.ctx-cell .stack { width: 70px; }

/* Charts */
.chart { position: relative; width: 100%; }
.chart-svg { display: block; overflow: visible; }
.chart-svg .grid { stroke: var(--line); stroke-width: 1; }
.chart-svg .grid.v { stroke-dasharray: 3 4; }
.chart-svg .axis { fill: var(--muted); font-size: 11px; font-family: var(--sans); }
.chart-svg .mark { stroke: var(--warn); stroke-dasharray: 3 3; }
.chart-svg .mark-l { fill: var(--warn); font-size: 10px; }
.chart-svg .cursor { stroke: var(--ink-3); stroke-width: 1; }
.chart-svg .bar { transition: opacity 0.1s; }
.chart-svg .bar:hover { opacity: 0.75; }
.tip { position: absolute; pointer-events: none; background: var(--card); border: 1px solid var(--line-2); border-radius: 9px; box-shadow: var(--shadow-lg); padding: 8px 10px; font-size: 12px; display: none; z-index: 3; white-space: nowrap; }
.tip b { display: block; margin-bottom: 3px; }
.tip div { display: flex; align-items: center; gap: 6px; color: var(--ink-2); }
.tip i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
.spark { display: block; }

/* Agents */
.agent-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(460px, 1fr)); gap: 16px; }
.agent-grid.list { grid-template-columns: 1fr; }
.agent { background: var(--card); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.agent-h { display: flex; align-items: flex-start; gap: 12px; }
.agent-h > div { flex: 1; min-width: 0; }
.agent-h h3 { font-size: 15px; font-weight: 600; }
.agent-h h3 small { font-weight: 450; color: var(--muted); font-size: 12.5px; }
.agent-h .sub { color: var(--muted); font-size: 12px; margin-top: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 34px; }
.issue { display: inline-flex; align-items: center; gap: 6px; background: var(--warn-soft); color: var(--warn); border-radius: 6px; padding: 2px 8px; font-size: 11.5px; font-weight: 550; white-space: nowrap; cursor: help; }
.issue i { width: 7px; height: 7px; border-radius: 50%; background: #f5b400; }
.agent-b { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.agent-stats, .agent-spend { border: 1px solid var(--line); border-radius: 11px; padding: 10px 12px; }
.agent-stats { display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; }
.agent-stats div { display: flex; justify-content: space-between; gap: 8px; }
.agent-stats span { color: var(--muted); }
.agent-stats b { font-weight: 600; }
.agent-spend { display: flex; flex-direction: column; gap: 6px; }
.agent-spend > span { font-size: 12.5px; font-weight: 550; }
.agent-spend-v { display: flex; align-items: baseline; gap: 2px; }
.agent-spend-v b { font-size: 14.5px; font-weight: 650; }
.agent-spend-v small { color: var(--muted); font-size: 11.5px; }
.agent-spend-v span { margin-left: auto; font-weight: 600; font-size: 13px; }
.agent-spend .ticks { max-width: none; height: 16px; }
.agent-c { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.agent-logos { display: flex; gap: 8px; min-width: 0; }
.logo-main { border: 1px solid var(--line); border-radius: 11px; width: 44px; height: 44px; display: grid; place-items: center; flex: none; }
.logo-main .logo { border: 0; }
.logo-row { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 11px; display: flex; align-items: center; gap: 6px; padding: 0 10px; height: 44px; overflow: hidden; }
.tool-names { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: var(--mono); }
.more { font-size: 11.5px; color: var(--muted); flex: none; }
.agent-link { border: 1px solid var(--line); border-radius: 11px; display: flex; align-items: center; gap: 10px; padding: 0 12px; height: 44px; font-size: 12.5px; color: var(--muted); }
.agent-link b { background: var(--tile); border-radius: 5px; padding: 1px 7px; color: var(--ink-2); font-size: 12px; }
.agent-link span { flex: 1; }
.agent-link .ic { color: var(--ink); }
.agent-link:hover { background: var(--hover); }
.agent-f { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-top: 2px; font-size: 12px; }
.last { color: var(--muted); white-space: nowrap; }
.last b { color: var(--ink); font-weight: 600; }
.agent-grid.list .agent { display: grid; grid-template-columns: 1.3fr 1.6fr 1.4fr; align-items: center; }
.agent-grid.list .agent-f { grid-column: 1 / -1; }

/* Projects */
.proj-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
.proj { background: var(--card); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }
.proj.on { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.proj header { display: flex; align-items: center; gap: 10px; min-width: 0; }
.proj header b { display: block; font-weight: 600; }
.proj header small { display: block; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.proj-stats { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--tile); border-radius: 10px; padding: 8px 4px; }
.proj-stats div { display: flex; flex-direction: column; padding: 0 10px; border-left: 1px solid var(--line); }
.proj-stats div:first-child { border-left: 0; }
.proj-stats span { font-size: 11.5px; color: var(--muted); }
.proj-stats b { font-size: 15px; font-weight: 600; }
.proj footer { display: flex; align-items: center; justify-content: space-between; margin-top: auto; font-size: 12px; }
.folders { display: flex; flex-direction: column; }
.folder { border-top: 1px solid var(--line); }
.folder:first-child { border-top: 0; }
.folder summary { display: flex; align-items: center; gap: 10px; padding: 9px 2px; cursor: pointer; list-style: none; font-size: 12.5px; }
.folder summary::-webkit-details-marker { display: none; }
.folder summary b { min-width: 120px; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 550; }
.folder summary .num { min-width: 56px; text-align: right; }
.folder[open] summary { color: var(--accent-ink); }
.folder .table-wrap { padding-bottom: 10px; }
.ctxfiles { list-style: none; margin: 0; padding: 0; }
.ctxfiles li { padding: 9px 0; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 3px; }
.ctxfiles li:first-child { border-top: 0; }
.ctxfiles b { font-weight: 550; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.flags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 3px; }
.outline { list-style: none; margin: 0; padding: 0; font-size: 12.5px; max-height: 420px; overflow-y: auto; }
.outline li { display: grid; grid-template-columns: 40px auto 1fr; gap: 10px; padding: 4px 0; align-items: baseline; }
.outline li .muted:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Key-value */
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 8px 16px; margin: 0; font-size: 13px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }

/* Integrations */
.int-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
.int { background: var(--card); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.int header { display: flex; align-items: center; gap: 12px; min-width: 0; }
.int header b { display: block; font-weight: 600; }
.int header small { display: block; color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.caps { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.caps li { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; color: var(--faint); border: 1px solid var(--line); border-radius: 6px; padding: 1px 7px; }
.caps li.on { color: var(--ink-2); }
.caps li.on .ic { color: var(--ok); }
.tele, .errs { list-style: none; margin: 0; padding: 0; font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 2px; }
.errs li { color: var(--bad); display: flex; gap: 6px; align-items: center; }
.int .code { margin-top: 0; }
.int footer { display: flex; justify-content: space-between; font-size: 11.5px; margin-top: auto; }
.errlist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.errlist code { display: block; font-size: 11.5px; color: var(--bad); margin-top: 2px; }

/* Settings and privacy */
.settings { list-style: none; margin: 0; padding: 0; }
.settings li { display: flex; align-items: center; gap: 16px; padding: 12px 0; border-top: 1px solid var(--line); }
.settings li:first-child { border-top: 0; padding-top: 0; }
.settings li b { font-weight: 600; }
.settings li p { color: var(--muted); font-size: 12px; margin-top: 2px; }
.settings .ctl { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex: none; }
.settings .seg { height: 30px; }
.paths, .patterns { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; }
.paths li { display: flex; align-items: center; gap: 8px; padding: 4px 0; border-top: 1px dashed var(--line); }
.paths li:first-child { border-top: 0; }
.paths .icon-btn { width: 26px; height: 26px; }
.patterns { flex-direction: row; flex-wrap: wrap; gap: 6px; }
.patterns li { background: var(--tile); border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; }
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.ticks-list { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; }
.ticks-list li { display: flex; gap: 7px; align-items: flex-start; }
.ticks-list li .ic { margin-top: 3px; }
.ticks-list.ok .ic { color: var(--ok); }
.ticks-list.no .ic { color: var(--bad); }
.card > .card { margin-top: 0; }
.grid > div > .card + .card { flex: none; }

/* Sessions toolbar */
.search { height: 32px; border: 1px solid var(--line-2); border-radius: 8px; background: var(--card); padding: 0 10px; min-width: 220px; font-size: 12.5px; }

/* Workflow canvas */
.page.wf-page { max-width: none; height: calc(100vh - 56px - 22px - 24px); gap: 12px; }
.wf-head { display: flex; align-items: flex-end; gap: 16px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 18px; box-shadow: var(--shadow); }
.wf-head > div:first-child { min-width: 0; flex: 1; }
.wf-head h1 { font-size: 18px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wf-head .sub { color: var(--muted); font-size: 12.5px; margin-top: 4px; }
.wf { flex: 1; min-height: 0; display: grid; grid-template-columns: 272px 1fr 260px; gap: 0; background: var(--card); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); overflow: hidden; }
.wf-left, .wf-right { display: flex; flex-direction: column; gap: 10px; padding: 12px; overflow-y: auto; min-height: 0; background: var(--card); }
.wf-left { border-right: 1px solid var(--line); }
.wf-right { border-left: 1px solid var(--line); }
.wf-panel-h { display: flex; align-items: center; gap: 8px; font-size: 15px; padding: 2px 4px 4px; }
.wf-panel-h b { font-weight: 600; }
.wf-sec { background: var(--tile); border: 1px solid var(--line); border-radius: 11px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.wf-sec.grow { flex: 1 1 auto; min-height: 160px; }
.wf-sec-h { display: flex; align-items: center; justify-content: space-between; font-size: 11px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); }
.wf-sec .kv { font-size: 12px; gap: 5px 10px; }
.wf-turns { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; overflow-y: auto; max-height: 340px; }
.wf-turns button { width: 100%; text-align: left; display: flex; gap: 8px; align-items: flex-start; border: 1px solid transparent; background: none; border-radius: 8px; padding: 6px; cursor: pointer; }
.wf-turns li.in button { background: var(--card); border-color: var(--line); }
.wf-turns button:hover { border-color: var(--line-2); }
.wf-turns .n { font-size: 11px; color: var(--muted); background: var(--seg); border-radius: 5px; min-width: 22px; text-align: center; padding: 1px 4px; margin-top: 1px; }
.wf-turns b { display: block; font-size: 12px; font-weight: 550; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wf-turns small { display: block; color: var(--muted); font-size: 11px; }
.wf-checks { display: flex; flex-direction: column; gap: 4px; }
.check { display: flex; align-items: center; gap: 8px; font-size: 12.5px; cursor: pointer; }
.check input { accent-color: var(--accent); margin: 0; }
.wf-mid { position: relative; min-width: 0; min-height: 0; display: flex; }
.wf-canvas { flex: 1; position: relative; overflow: hidden; cursor: grab; outline: none; background-color: var(--bg);
  background-image: radial-gradient(circle, var(--dot) 1.1px, transparent 1.3px); background-size: 18px 18px; }
.wf-canvas.grab { cursor: grabbing; }
.wf-world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.wf-world.anim { transition: transform 0.28s ease; }
.wf-edges { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
.wf-e { fill: none; stroke: var(--line-2); stroke-width: 1.5; }
:root[data-theme="dark"] .wf-e { stroke: #3a3a44; }
.wf-e.branch, .wf-e.merge { stroke: var(--ink-3); stroke-opacity: 0.55; }
.wf-e.snout { stroke: var(--accent-hi); stroke-dasharray: 4 3; }
.wf-e.run { stroke: var(--info); stroke-dasharray: 5 4; animation: dash 0.8s linear infinite; }
.wf-e.dim { opacity: 0.25; }
@keyframes dash { to { stroke-dashoffset: -18; } }
.wf-nodes { position: absolute; inset: 0; }
.wf-node { position: absolute; background: var(--card); border: 1px solid var(--line-2); border-radius: 11px; box-shadow: 0 1px 2px rgba(20, 20, 30, 0.05), 0 4px 12px -6px rgba(20, 20, 30, 0.12); padding: 9px 11px; display: flex; flex-direction: column; gap: 3px; cursor: pointer; font-size: 12px; transition: opacity 0.15s, box-shadow 0.15s; }
.wf-node:hover { border-color: var(--ink-3); }
.wf-node.sel { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.wf-node.now { box-shadow: 0 0 0 3px var(--info-soft); border-color: var(--info); }
.wf-node.dim { opacity: 0.3; }
.wf-node.main { padding-top: 11px; }
.wf-node.snout { background: color-mix(in srgb, var(--accent-soft) 55%, var(--card)); border-color: var(--accent-hi); }
.wf-node.k-would { background: var(--warn-soft); border-color: color-mix(in srgb, var(--warn) 40%, transparent); }
.wf-node.k-compact { background: var(--tile); border-style: dashed; }
.wf-node.st-failed { border-color: var(--bad); }
.wf-node.st-running { border-color: var(--info); }
.wf-node.cap { flex-direction: row; align-items: center; justify-content: center; gap: 7px; border-radius: 20px; padding: 0 14px; color: var(--muted); }
.wf-node.cap b { color: var(--ink-2); font-weight: 550; }
.wf-node.cap small { font-size: 11px; }
.wf-pill { position: absolute; top: -11px; left: 10px; font-size: 10.5px; font-weight: 550; background: var(--card); border: 1px solid var(--line-2); color: var(--ink-2); border-radius: 6px; padding: 1px 7px; white-space: nowrap; }
.wf-h { display: flex; align-items: center; gap: 7px; min-width: 0; }
.wf-h b { flex: 1; min-width: 0; font-weight: 600; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wf-h .chip { font-size: 10.5px; padding: 0 6px; }
.wf-d { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wf-m { color: var(--ink-2); font-size: 11.5px; margin-top: auto; padding-top: 4px; border-top: 1px solid var(--line); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wf-node.snout .wf-m { border-top-color: color-mix(in srgb, var(--accent-hi) 50%, transparent); color: var(--accent-ink); }
.wf-node.child.snout .wf-m, .wf-node.child .wf-m { padding-top: 3px; }
.wf-ic { width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; flex: none; }
.wf-ic.k-agent { background: #ecebff; color: #5b55d6; }
.wf-ic.k-tools { background: #e7f4ee; color: #1f8a5b; }
.wf-ic.k-snout { background: var(--accent-soft); color: var(--accent-ink); }
.wf-ic.k-context { background: var(--warn-soft); color: var(--warn); }
:root[data-theme="dark"] .wf-ic.k-agent { background: #24224a; color: #a5a1ff; }
:root[data-theme="dark"] .wf-ic.k-tools { background: #142c22; color: #5fd3a0; }
.wf-bottom { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; gap: 8px; align-items: center; }
.wf-bottom .seg { background: var(--card); border: 1px solid var(--line-2); box-shadow: var(--shadow); height: 34px; }
.wf-bottom .seg button.on { background: var(--tile); box-shadow: none; border: 1px solid var(--line-2); }
.wf-zoom { display: flex; align-items: center; gap: 2px; background: var(--card); border: 1px solid var(--line-2); border-radius: 9px; padding: 2px; box-shadow: var(--shadow); height: 34px; }
.wf-zoom .icon-btn { border: 0; width: 28px; height: 28px; background: none; }
.wf-zoom .icon-btn:hover { background: var(--hover); }
.wf-zoom > span { min-width: 44px; text-align: center; font-size: 12.5px; }
.wf-tabs { display: flex; background: var(--seg); border-radius: 9px; padding: 2px; }
.wf-tabs button { flex: 1; border: 0; background: none; border-radius: 7px; padding: 6px; font-size: 12.5px; font-weight: 550; color: var(--muted); cursor: pointer; }
.wf-tabs button.on { background: var(--card); color: var(--ink); box-shadow: 0 1px 2px rgba(17, 17, 19, 0.1); }
.wf-sum { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.wf-sum div { background: var(--tile); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; display: flex; flex-direction: column; }
.wf-sum span { font-size: 11.5px; color: var(--muted); }
.wf-sum b { font-size: 16px; font-weight: 650; }
.wf-pal { display: flex; align-items: center; gap: 9px; width: 100%; background: var(--card); border: 1px solid var(--line); border-radius: 9px; padding: 6px 8px; font-size: 12.5px; cursor: pointer; text-align: left; }
.wf-pal:hover { border-color: var(--line-2); background: var(--hover); }
.wf-pal.on { border-color: var(--accent); background: var(--accent-soft); }
.wf-pal b { font-size: 11.5px; color: var(--muted); font-weight: 600; }
.wf-detail { display: flex; flex-direction: column; gap: 10px; }
.wf-detail-h { display: flex; align-items: center; gap: 9px; }
.wf-detail-h > div { flex: 1; min-width: 0; }
.wf-detail-h b { display: block; font-weight: 600; overflow-wrap: anywhere; }
.wf-detail-h small { color: var(--muted); }
.wf-detail .kv { font-size: 12px; gap: 6px 10px; }
.wf-text { margin: 0; background: var(--tile); border: 1px solid var(--line); border-radius: 9px; padding: 9px; font: 11.5px/1.5 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 220px; overflow-y: auto; }
.wf-reason { background: var(--accent-soft); border-radius: 9px; padding: 8px 10px; }
.wf-reason small { color: var(--accent-ink); font-weight: 600; }
.wf-reason p { font-size: 12px; margin-top: 2px; }

/* Toasts */
.toasts { position: fixed; right: 20px; bottom: 20px; display: flex; flex-direction: column; gap: 8px; z-index: 20; }
.toast { background: var(--ink); color: var(--card); padding: 10px 14px; border-radius: 10px; font-size: 13px; box-shadow: var(--shadow-lg); max-width: 380px; transition: opacity 0.3s, transform 0.3s; }
.toast.bad { background: var(--bad); color: #fff; }
.toast.out { opacity: 0; transform: translateY(6px); }

/* Fallback */
.noscript { max-width: 520px; margin: 80px auto; padding: 24px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; }

@media (max-width: 1200px) {
  .span-3, .span-4, .span-5 { grid-column: span 6; }
  .span-7, .span-8 { grid-column: span 12; }
  .wf { grid-template-columns: 240px 1fr; }
  .wf-right { display: none; }
}
@media (max-width: 860px) {
  .shell, .shell.collapsed { grid-template-columns: 1fr; }
  .side { position: static; height: auto; flex-direction: row; flex-wrap: wrap; padding: 10px 16px; border-right: 0; border-bottom: 1px solid var(--line); }
  .side-nav { flex-direction: row; flex-wrap: wrap; flex: 1 1 100%; }
  .side-g, .side-f { display: none; }
  .top { padding: 0 16px; height: auto; min-height: 56px; flex-wrap: wrap; padding-top: 8px; padding-bottom: 8px; position: static; }
  .tools { flex-wrap: wrap; margin-left: 0; }
  .main { padding: 16px 16px 48px; }
  .grid > div { grid-column: span 12; }
  .agent-grid, .int-grid, .proj-grid { grid-template-columns: 1fr; }
  .agent-b, .agent-c, .two-col, .tiles.two { grid-template-columns: 1fr; }
  .card.models { grid-template-columns: 1fr; }
  .model { border-left: 0; border-top: 1px solid var(--line); padding: 14px 18px; }
  .model:first-child { border-top: 0; }
  .wf { grid-template-columns: 1fr; }
  .wf-left { display: none; }
  .page.wf-page { height: auto; }
  .wf-mid { height: 70vh; }
  .search { min-width: 0; width: 100%; }
}
/* Snout in the corner: the welcome and the three-stop tour (app/tour.ts). */
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.tour { position: fixed; right: 14px; bottom: 0; z-index: 15; width: 360px; height: 330px; pointer-events: none; transition: opacity 0.55s cubic-bezier(0.16, 1, 0.3, 1); }
.tour[hidden] { display: none; }
.tour.closing { opacity: 0; }
.tour-pal { position: absolute; right: 0; bottom: 0; width: 120px; height: 134px; transform: translateY(150%); transition: transform 0.65s cubic-bezier(0.16, 1, 0.3, 1); }
.tour.up .tour-pal { transform: translateY(0); }
.tour-pal.hop { animation: tour-hop 0.6s cubic-bezier(0.3, 0.7, 0.4, 1); }
@keyframes tour-hop { 0%, 100% { translate: 0 0; } 35% { translate: 0 -14px; } 60% { translate: 0 0; } 78% { translate: 0 -4px; } }
.tour-img { width: 100%; height: 100%; object-fit: contain; display: block; user-select: none; }
.tour-img.fallback { padding: 30px 18px 40px; }
.tour-x { position: absolute; top: 4px; right: 4px; width: 24px; height: 24px; border-radius: 12px; border: 1px solid var(--line-2); background: var(--card); color: var(--ink-2); display: grid; place-items: center; padding: 0; cursor: pointer; pointer-events: auto; box-shadow: 0 2px 6px rgba(40, 20, 35, 0.18); }
.tour-x:hover { color: var(--ink); transform: scale(1.06); }
.tour-bubble { position: absolute; right: 66px; bottom: 126px; width: 280px; padding: 13px 15px 11px; background: var(--card); color: var(--ink); border: 1px solid var(--line-2); border-radius: 14px; box-shadow: 0 12px 30px -12px rgba(40, 20, 35, 0.3); font-size: 13.5px; line-height: 1.5; transform-origin: 100% 100%; transform: scale(0.6); opacity: 0; transition: transform 0.32s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.22s; pointer-events: none; display: flex; flex-direction: column; gap: 6px; }
.tour-bubble.open { transform: scale(1); opacity: 1; pointer-events: auto; }
.tour-bubble::after { content: ""; position: absolute; right: 22px; bottom: -7px; width: 12px; height: 12px; background: var(--card); border-right: 1px solid var(--line-2); border-bottom: 1px solid var(--line-2); transform: rotate(45deg); }
.tour-title { font-size: 11.5px; font-weight: 600; letter-spacing: 0.02em; color: var(--accent-ink); }
.tour-text { min-height: 3em; }
.tour-text.typing::after { content: ""; display: inline-block; width: 2px; height: 1em; margin-left: 1px; vertical-align: -0.15em; background: var(--accent); animation: tour-caret 0.9s steps(1) infinite; }
@keyframes tour-caret { 50% { opacity: 0; } }
