<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Snout</title>
<link rel="icon" href="__SNOUT_ICON__">
<style>
:root {
  --bg: #f5f5f3; --card: #ffffff; --ink: #18151a; --ink-2: #3a3a3f; --muted: #6b6b73; --line: #ebebe8; --line-2: #e1e1dd;
  --accent: #e653ba; --accent-ink: #b0307f; --accent-soft: #fdeaf6; --bad: #c2273d; --bad-soft: #fde8eb; --tile: #f7f7f5;
  --sans: "Inter", ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0d0d10; --card: #16161a; --ink: #f3f3f5; --ink-2: #d4d4d8; --muted: #a1a1aa; --line: #25252b; --line-2: #2f2f36;
    --accent: #ee63b8; --accent-ink: #f58ccb; --accent-soft: #3a1830; --bad: #f87171; --bad-soft: #341518; --tile: #1c1c21; color-scheme: dark; }
}
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-content: center; justify-items: center; padding: 16px; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--sans); }
.card { width: min(400px, 100%); background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 28px; box-shadow: 0 1px 2px rgba(20, 20, 30, 0.04), 0 24px 48px -24px rgba(20, 20, 40, 0.3); }
.brand { display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: 17px; margin-bottom: 22px; }
.brand img { width: 30px; height: 25px; }
h1 { font-size: 20px; line-height: 1.25; margin: 0 0 6px; letter-spacing: -0.01em; }
p { color: var(--muted); margin: 0 0 18px; }
.btn { display: flex; align-items: center; justify-content: center; gap: 9px; width: 100%; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--card); color: var(--ink); font: 600 14px var(--sans); text-decoration: none; cursor: pointer; }
.btn:hover { background: var(--tile); }
.btn.primary { background: var(--ink); border-color: var(--ink); color: var(--card); }
.btn.primary:hover { opacity: 0.9; }
.btn svg { width: 18px; height: 18px; fill: currentColor; }
.or { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 12px; margin: 18px 0 14px; }
.or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--line); }
form { display: flex; gap: 8px; }
input { flex: 1; min-width: 0; padding: 9px 11px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--card); color: var(--ink); font: 14px var(--sans); }
input:focus, .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
form .btn { width: auto; }
.dev { font-size: 12px; color: var(--muted); margin: 8px 0 0; }
.note { font-size: 12.5px; color: var(--muted); margin: 20px 0 0; padding-top: 16px; border-top: 1px solid var(--line); }
code { font: 12.5px var(--mono); background: var(--tile); border: 1px solid var(--line); border-radius: 5px; padding: 1px 5px; }
.err { background: var(--bad-soft); color: var(--bad); border-radius: 8px; padding: 9px 11px; margin-bottom: 16px; font-size: 13px; }
.links { display: flex; gap: 16px; justify-content: center; margin-top: 18px; font-size: 13px; }
.links a { color: var(--muted); text-decoration: none; }
.links a:hover { color: var(--ink); text-decoration: underline; }
.off { font-size: 13px; color: var(--muted); background: var(--tile); border: 1px dashed var(--line-2); border-radius: 8px; padding: 10px 12px; }
</style>
</head>
<body>
<main class="card" id="card">
  <div class="brand"><img src="__SNOUT_ICON__" alt="">Snout</div>
  <h1>Sign in to Snout Cloud</h1>
  <p>Loading…</p>
</main>
<nav class="links" aria-label="More about Snout">
  <a href="https://www.usesnout.xyz/">What is Snout</a>
  <a href="https://www.usesnout.xyz/docs">Docs</a>
  <a href="https://www.usesnout.xyz/privacy">Privacy</a>
</nav>
<script>
(function () {
  "use strict";
  var card = document.getElementById("card");
  var params = new URLSearchParams(location.search);
  var raw = params.get("next") || "/app";
  // Same rule as the server's safeNext: only a path on this site.
  var next = raw.charAt(0) === "/" && raw.charAt(1) !== "/" && raw.indexOf("\\") < 0 ? raw : "/app";
  var GITHUB = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>';
  function h(tag, attrs) {
    var el = document.createElement(tag);
    for (var k in attrs || {}) {
      if (k === "text") el.textContent = attrs[k];
      else if (k === "html") el.innerHTML = attrs[k];
      else if (k === "cls") el.className = attrs[k];
      else el.setAttribute(k, attrs[k]);
    }
    for (var i = 2; i < arguments.length; i++) if (arguments[i]) el.appendChild(typeof arguments[i] === "string" ? document.createTextNode(arguments[i]) : arguments[i]);
    return el;
  }
  var brand = card.firstElementChild;
  fetch("/auth/config").then(function (r) { return r.json(); }).then(function (c) {
    var kids = [brand, h("h1", { text: "Sign in to Snout Cloud" }),
      h("p", { text: "Your team's token totals and spend, from the machines that run snout login. Snout works locally without an account." })];
    if (params.get("error")) kids.push(h("div", { cls: "err", role: "alert", text: params.get("error").slice(0, 200) }));
    if (c.github) {
      var gh = h("a", { cls: "btn primary", href: "/auth/github?next=" + encodeURIComponent(next) });
      gh.innerHTML = GITHUB;
      gh.appendChild(document.createTextNode("Continue with GitHub"));
      kids.push(gh);
    } else {
      kids.push(h("div", { cls: "off", text: "GitHub sign-in is not set up on this server (GITHUB_CLIENT_ID)." }));
    }
    if (c.dev) {
      var input = h("input", { name: "login", value: "dev", "aria-label": "Dev username", autocomplete: "off", spellcheck: "false" });
      var form = h("form", { action: "/auth/dev", method: "get" }, input, h("input", { type: "hidden", name: "next", value: next }), h("button", { cls: "btn", type: "submit", text: "Dev sign-in" }));
      kids.push(h("div", { cls: "or", text: "local development" }), form, h("p", { cls: "dev", text: "No password: any name signs in as that user. Off unless the server runs with --dev." }));
    }
    kids.push(h("p", { cls: "note", html: "Snout Cloud receives daily totals only: reads and tokens per agent, model and file label, and measured spend. Never file contents, paths or prompts. <code>snout sync --dry-run</code> prints exactly what is sent." }));
    card.replaceChildren.apply(card, kids);
  }).catch(function () {
    card.replaceChildren(brand, h("h1", { text: "Snout Cloud is not answering" }), h("p", { text: "Try again in a moment." }));
  });
})();
</script>
</body>
</html>
